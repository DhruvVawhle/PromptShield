name: CI - PromptShield Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-promptshield
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyFakeApiKeyForCITesting0000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test-promptshield.firebaseapp.com
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_API_KEY: gsk_fake_ci_key_for_testing_only
      GROQ_MODEL: qwen/qwen3.8-27b
      GEMINI_API_KEY: fake-gemini-ci-key-for-testing-only
      GEMINI_MODEL: gemini-flash-lite-latest
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      AUDIT_SIGNING_KEY: ci-test-deterministic-signing-secret-key-32b
      RATE_LIMIT_ALLOW_FALLBACK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Test Suite (Unit, Integration, Security, Audit)
        working-directory: frontend
        run: npm test

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build
